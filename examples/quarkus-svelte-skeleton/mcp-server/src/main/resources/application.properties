quarkus.application.name=agui-showcase-mcp-server
quarkus.http.port=8081
quarkus.http.test-port=0
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.smallrye-health.root-path=/q/health
%test.agui.health.warmup-on-start=false

# Jib Layered Container Image Configuration
quarkus.container-image.builder=jib
quarkus.container-image.group=nomad-agui-showcase
quarkus.container-image.name=mcp-server
quarkus.container-image.tag=latest
quarkus.jib.base-jvm-image=eclipse-temurin:25-jre
