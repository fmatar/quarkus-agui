quarkus.application.name=agui-showcase-backend
quarkus.http.port=8080
quarkus.http.test-port=0
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.banner.enabled=false

# Idiomatic Quarkus LangChain4j MCP Client (Vert.x Streamable HTTP -> :8081/mcp)
quarkus.langchain4j.mcp.nomad.transport-type=streamable-http
quarkus.langchain4j.mcp.nomad.url=${AGUI_MCP_URL:http://127.0.0.1:8081/mcp}
quarkus.langchain4j.mcp.nomad.protocol-version=2025-11-25
quarkus.langchain4j.mcp.nomad.tool-execution-timeout=8s
quarkus.langchain4j.mcp.nomad.resources-timeout=5s
quarkus.langchain4j.mcp.nomad.ping-timeout=3s
quarkus.langchain4j.mcp.nomad.microprofile-health-check=true
quarkus.langchain4j.mcp.nomad.log-requests=true
quarkus.langchain4j.mcp.nomad.log-responses=true

# Idiomatic Quarkus LangChain4j Ollama Chat Model & ChatMemory
quarkus.langchain4j.ollama.base-url=${AGUI_OLLAMA_BASE_URL:http://127.0.0.1:11434}
quarkus.langchain4j.ollama.chat-model.model-id=${AGUI_OLLAMA_MODEL:llama3.2:latest}
quarkus.langchain4j.ollama.chat-model.temperature=0.1
quarkus.langchain4j.ollama.timeout=30s
quarkus.langchain4j.ollama.devservices.enabled=false
%test.quarkus.langchain4j.ollama.devservices.enabled=false
quarkus.langchain4j.chat-memory.memory-window.max-messages=16

# Upstream Specialist & MicroProfile SmallRye Health Endpoints
agui.mcp.health-url=${AGUI_MCP_HEALTH_URL:http://127.0.0.1:8081/q/health/ready}
agui.a2a.base-url=${AGUI_A2A_BASE_URL:http://127.0.0.1:8082}
quarkus.smallrye-health.root-path=/q/health

# Quarkus Quinoa SPA Frontend Packaging (SvelteKit 5 @sveltejs/adapter-static)
quarkus.quinoa.ui-dir=../frontend
quarkus.quinoa.build-dir=build
quarkus.quinoa.package-manager=pnpm
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.ignored-path-prefixes=/api,/mcp,/q
quarkus.quinoa.dev-server.port=5173
quarkus.quinoa.sbom.enabled=false
%test.quarkus.quinoa=false

# Jib Layered Container Image Configuration
quarkus.container-image.builder=jib
quarkus.container-image.group=nomad-agui-showcase
quarkus.container-image.name=backend
quarkus.container-image.tag=latest
quarkus.jib.base-jvm-image=eclipse-temurin:25-jre
