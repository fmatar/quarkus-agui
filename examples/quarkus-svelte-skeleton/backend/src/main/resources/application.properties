quarkus.application.name=agui-showcase-backend
quarkus.http.port=8080
quarkus.http.test-port=0
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.banner.enabled=false
quarkus.langchain4j.ollama.base-url=http://127.0.0.1:11434
quarkus.langchain4j.ollama.chat-model.model-id=llama3.2:latest
%test.quarkus.langchain4j.ollama.devservices.enabled=false
quarkus.langchain4j.ollama.devservices.enabled=false

# Quarkus Quinoa SPA Frontend Packaging (SvelteKit 5 @sveltejs/adapter-static)
quarkus.quinoa.ui-dir=../frontend
quarkus.quinoa.build-dir=build
quarkus.quinoa.package-manager=pnpm
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.ignored-path-prefixes=/api,/mcp
quarkus.quinoa.dev-server.port=5173
quarkus.quinoa.sbom.enabled=false
%test.quarkus.quinoa=false

# Jib Layered Container Image Configuration
quarkus.container-image.builder=jib
quarkus.container-image.group=nomad-agui-showcase
quarkus.container-image.name=backend
quarkus.container-image.tag=latest
quarkus.jib.base-jvm-image=eclipse-temurin:25-jre
