name: nomad-agui-showcase

services:
  mcp-server:
    container_name: nomad-mcp-server
    build:
      context: ../..
      dockerfile: examples/quarkus-svelte-skeleton/Dockerfile.quarkus
      target: mcp-server
    ports:
      - "8081:8081"
    environment:
      - QUARKUS_HTTP_HOST=0.0.0.0
      - QUARKUS_HTTP_PORT=8081
    restart: unless-stopped

  a2a-server:
    container_name: nomad-a2a-server
    build:
      context: ../..
      dockerfile: examples/quarkus-svelte-skeleton/Dockerfile.quarkus
      target: a2a-server
    ports:
      - "8082:8082"
    environment:
      - QUARKUS_HTTP_HOST=0.0.0.0
      - QUARKUS_HTTP_PORT=8082
      - AGUI_A2A_PUBLIC_URL=http://a2a-server:8082
    restart: unless-stopped

  backend:
    container_name: nomad-agui-orchestrator
    build:
      context: ../..
      dockerfile: examples/quarkus-svelte-skeleton/Dockerfile.quarkus
      target: backend
    ports:
      - "8080:8080"
    environment:
      - QUARKUS_HTTP_HOST=0.0.0.0
      - QUARKUS_HTTP_PORT=8080
      - AGUI_MCP_BASE_URL=http://mcp-server:8081
      - AGUI_A2A_BASE_URL=http://a2a-server:8082
      - AGUI_OLLAMA_BASE_URL=http://host.docker.internal:11434
    depends_on:
      - mcp-server
      - a2a-server
    restart: unless-stopped

  frontend:
    container_name: nomad-concierge-studio
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - AGUI_BACKEND_PROXY_TARGET=http://backend:8080
      - PUBLIC_AGUI_BACKEND_URL=http://localhost:8080
    depends_on:
      - backend
    restart: unless-stopped
