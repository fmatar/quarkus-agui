name: nomad-agui-showcase

services:
  mcp-server:
    container_name: nomad-mcp-server
    image: nomad-agui-showcase/mcp-server:latest
    ports:
      - "8081:8081"
    environment:
      - QUARKUS_HTTP_HOST=0.0.0.0
      - QUARKUS_HTTP_PORT=8081
    restart: unless-stopped

  a2a-server:
    container_name: nomad-a2a-server
    image: nomad-agui-showcase/a2a-server:latest
    ports:
      - "8082:8082"
    environment:
      - QUARKUS_HTTP_HOST=0.0.0.0
      - QUARKUS_HTTP_PORT=8082
      - AGUI_A2A_PUBLIC_URL=http://a2a-server:8082
    restart: unless-stopped

  backend:
    container_name: nomad-agui-orchestrator
    image: nomad-agui-showcase/backend:latest
    ports:
      - "8080:8080"
    environment:
      - QUARKUS_HTTP_HOST=0.0.0.0
      - QUARKUS_HTTP_PORT=8080
      - AGUI_MCP_BASE_URL=http://mcp-server:8081
      - AGUI_A2A_BASE_URL=http://a2a-server:8082
      - AGUI_OLLAMA_BASE_URL=http://host.docker.internal:11434
    depends_on:
      - mcp-server
      - a2a-server
    restart: unless-stopped
